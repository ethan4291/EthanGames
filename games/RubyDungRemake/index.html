  return [atlasPixels[i], atlasPixels[i + 1], atlasPixels[i + 2]];
}

function drawText(b, s, x0, y0, color) {
  const shadow = color.map((v) => v * 0.25);
  for (const pass of [0, 1]) {
    let x = x0;
    for (const ch of s.toUpperCase()) {
      const g = FONT[ch] || FONT[" "];
      for (let gy = 0; gy < 7; gy++) {
        for (let gx = 0; gx < 5; gx++) {
          if (g[gy][gx] !== "#") continue;
          if (pass === 0) setPixel(b, x + gx + 1, y0 + gy + 1, shadow);
          else setPixel(b, x + gx, y0 + gy, color);
        }
      }
      x += 6;
    }
  }
}

function outline(b) {
  for (let x = 0; x < b.w; x++) { setPixel(b, x, 0, [0, 0, 0]); setPixel(b, x, b.h - 1, [0, 0, 0]); }
  for (let y = 0; y < b.h; y++) { setPixel(b, 0, y, [0, 0, 0]); setPixel(b, b.w - 1, y, [0, 0, 0]); }
}

function blit(canvas, b, scale = HUD_SCALE) {
  canvas.width = b.w;
  canvas.height = b.h;
  canvas.style.width = b.w * scale + "px";
  canvas.style.height = b.h * scale + "px";
  canvas.getContext("2d").putImageData(new ImageData(b.data, b.w, b.h), 0, 0);
}

// rows: [{ cells: [text, text?], color?: [r,g,b] }]
function drawPanel(canvas, rows) {
  const pad = 6, top = 9, lineH = 10;
  const keyW = Math.max(0, ...rows.filter((r) => r.cells.length > 1).map((r) => textWidth(r.cells[0]))) + 10;
  const contentW = Math.max(...rows.map((r) => (r.cells.length > 1 ? keyW + textWidth(r.cells[1]) : textWidth(r.cells[0]))));
  const b = makeBuffer(contentW + pad * 2, top + rows.length * lineH + pad - 3);

  // Background: darkened dirt, with the grass fringe along the top edge.
  const T = world.T;
  for (let y = 0; y < b.h; y++) {
    for (let x = 0; x < b.w; x++) {
      const tx = x & 15, ty = y & 15;
      const side = tilePixel(T.grass_side, tx, ty);
      const dirt = tilePixel(T.dirt, tx, ty);
      const isGrass = y < 16 && (side[0] !== dirt[0] || side[1] !== dirt[1] || side[2] !== dirt[2]);
      setPixel(b, x, y, isGrass ? side : dirt.map((v) => v * 0.38), 235);
    }
  }
  outline(b);

  rows.forEach((r, i) => {
    const y = top + i * lineH;
    if (r.cells.length > 1) {
      drawText(b, r.cells[0], pad, y, HUD_KEY);
      drawText(b, r.cells[1], pad + keyW, y, r.color || HUD_TEXT);
    } else {
      drawText(b, r.cells[0], pad, y, r.color || HUD_TEXT);
    }
  });
  blit(canvas, b);
}

// Stone button with a bevelled edge; turns blue with yellow text on hover.
const modeButton = document.getElementById("modeButton");
let buttonHover = false;

function drawButton(canvas, label, hover, width, scale) {
  const b = makeBuffer(Math.max(width || 0, textWidth(label) + 24), 20);
  for (let y = 0; y < b.h; y++) {
    for (let x = 0; x < b.w; x++) {
      let c = tilePixel(world.T.stone, x & 15, y & 15).map((v) => v * 0.8);
      if (hover) c = [c[0] * 0.75 + 12, c[1] * 0.8 + 20, c[2] * 1.05 + 55];
      if (y === 1 || x === 1) c = c.map((v) => v * 1.45 + 20);
      else if (y === b.h - 2 || x === b.w - 2) c = c.map((v) => v * 0.55);
      setPixel(b, x, y, c);
    }
  }
  outline(b);
  drawText(b, label, Math.floor((b.w - textWidth(label)) / 2), 6, hover ? [255, 255, 160] : [224, 224, 224]);
  blit(canvas, b, scale);
}

function drawModeButton() {
  drawButton(modeButton, mode === "creative" ? "First Person Mode" : "Creative Mode", buttonHover);
}

// ---------------------------------------------------------------------------
// Main menu: block-letter title made from the grass/dirt textures, a Play
// button, and the world slowly turning in the background.
// ---------------------------------------------------------------------------

let inMenu = true;
let playHover = false;
const menuEl = document.getElementById("menu");
const playButton = document.getElementById("playButton");

function menuScale() {
  return window.innerWidth < 700 ? 2 : 3;
}

function drawTitle() {
  const big = "RUBY DUNG", small = "REMAKE";
  const C = 4;                                    // screen pixels per font pixel
  const bigW = textWidth(big) * C, bigH = 7 * C;
  const depth = 3;                                // extruded shadow depth
  const smallW = textWidth(small) * 2;
  const top = 2;
  const b = makeBuffer(bigW + depth + 2, top + bigH + depth + 10 + 7 * 2 + 2);
  const T = world.T;

  const glyphOn = (s, x, y, cell) => {
    const gx = Math.floor(x / cell), gy = Math.floor(y / cell);
    const ci = Math.floor(gx / 6), cx = gx % 6;
    if (ci >= s.length || cx >= 5 || gy < 0 || gy >= 7) return false;
    const g = FONT[s[ci]] || FONT[" "];
    return g[gy][cx] === "#";
  };

  // Big letters: dark extruded sides, then the grass-block face on top.
  for (let d = depth; d >= 0; d--) {
    for (let y = 0; y < bigH; y++) {
      for (let x = 0; x < bigW; x++) {
        if (!glyphOn(big, x, y, C)) continue;
        const ty = Math.min(15, Math.floor((y * 16) / bigH));
        let c = tilePixel(T.grass_side, x & 15, ty);
        if (d > 0) c = tilePixel(T.dirt, x & 15, y & 15).map((v) => v * (0.1 + 0.05 * (depth - d)));
        else if (y % C === 0) c = c.map((v) => v * 1.3);
        else if (y % C === C - 1) c = c.map((v) => v * 0.85);
        setPixel(b, x + d, top + y + d, c);
      }
    }
  }

  // "REMAKE" underneath in yellow pixel text with a shadow.
  const sx = Math.floor((b.w - smallW) / 2), sy = top + bigH + depth + 8;
  for (const pass of [0, 1]) {
    for (let y = 0; y < 14; y++) {
      for (let x = 0; x < smallW; x++) {
        if (!glyphOn(small, x, y, 2)) continue;
        if (pass === 0) setPixel(b, sx + x + 2, sy + y + 2, [63, 63, 21]);
        else setPixel(b, sx + x, sy + y, [255, 255, 85]);
      }
    }
  }
  blit(document.getElementById("title"), b, menuScale());
}

function drawPlayButton() {
  drawButton(playButton, "Play", playHover, 200, menuScale() - 1);
}

function drawMenu() {
  drawTitle();
  drawPlayButton();
}

const HUD_IDS = ["info", "controls", "modeButton", "crosshair"];

function openMenu() {
  inMenu = true;
  dragMode = null;
  keys.clear();
  if (document.pointerLockElement === canvas) document.exitPointerLock();
  menuEl.classList.remove("hidden");
  for (const id of HUD_IDS) document.getElementById(id).classList.add("hidden");
}

function play() {
  inMenu = false;
  playHover = false;
  drawPlayButton();
  menuEl.classList.add("hidden");
  for (const id of HUD_IDS) document.getElementById(id).classList.remove("hidden");
  if (mode === "first") lockPointer();
}

playButton.addEventListener("mouseenter", () => { playHover = true; drawPlayButton(); });
playButton.addEventListener("mouseleave", () => { playHover = false; drawPlayButton(); });
playButton.addEventListener("click", () => play());
window.addEventListener("resize", () => { if (atlasPixels) drawMenu(); });
window.addEventListener("keydown", (e) => {
  if (e.code === "KeyM" && !inMenu && !e.repeat) openMenu();
});

modeButton.addEventListener("mouseenter", () => { buttonHover = true; drawModeButton(); });
modeButton.addEventListener("mouseleave", () => { buttonHover = false; drawModeButton(); });
modeButton.addEventListener("click", () => toggleMode());

function drawCrosshair() {
  const b = makeBuffer(9, 9);
  for (let i = 0; i < 9; i++) {
    setPixel(b, i, 4, [255, 255, 255]);
    setPixel(b, 4, i, [255, 255, 255]);
  }
  blit(document.getElementById("crosshair"), b);
}

function drawControls() {
  const rows = mode === "creative" ? [
    { cells: ["Ruby Dung Remake - Creative"], color: HUD_TITLE },
    { cells: ["Left-drag", "Move around"] },
    { cells: ["Right-drag", "Change angle"] },
    { cells: ["Wheel", "Forward / back"] },
    { cells: ["W A S D", "Fly"] },
    { cells: ["Space/Shift", "Up / down"] },
    { cells: ["Ctrl", "Fly faster"] },
    { cells: ["M", "Main menu"] },
  ] : [
    { cells: ["Ruby Dung Remake - First Person"], color: HUD_TITLE },
    { cells: ["Click", "Capture mouse"] },
    { cells: ["Mouse", "Look around"] },
    { cells: ["W A S D", "Walk"] },
    { cells: ["Space", "Jump / swim up"] },
    { cells: ["Ctrl or W W", "Sprint"] },
    { cells: ["Shift", "Sneak"] },
    { cells: ["Esc", "Free mouse"] },
    { cells: ["M", "Main menu"] },
  ];
  drawPanel(document.getElementById("controls"), rows);
}

const infoCanvas = document.getElementById("info");
let infoTimer = 0;
let lastInfo = "";
let fpsFrames = 0, fps = 0;

function updateInfo(dt) {
  fpsFrames++;
  infoTimer -= dt;
  if (infoTimer > 0) return;
  fps = Math.round(fpsFrames / 0.5);
  fpsFrames = 0;
  infoTimer = 0.5;
  const x = Math.floor(camera.x), y = Math.floor(camera.y), z = Math.floor(camera.z);
  const biome = world.BIOMES[world.columnInfo(x, z).biome];
  const rows = [
    { cells: [biome], color: HUD_TITLE },
    { cells: ["X", String(x)] },
    { cells: ["Y", String(y)] },
    { cells: ["Z", String(z)] },
    { cells: ["FPS", String(fps)] },
  ];
  const key = JSON.stringify(rows);
  if (key !== lastInfo) {
    lastInfo = key;
    drawPanel(infoCanvas, rows);
  }
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.floor(canvas.clientWidth * dpr);
  const h = Math.floor(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  gl.viewport(0, 0, canvas.width, canvas.height);
}

function bindChunkBuffer(buf) {
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.vertexAttribPointer(attr.pos, 3, gl.FLOAT, false, 28, 0);
  gl.vertexAttribPointer(attr.uv, 2, gl.FLOAT, false, 28, 12);
  gl.vertexAttribPointer(attr.light, 1, gl.FLOAT, false, 28, 20);
  gl.vertexAttribPointer(attr.anim, 1, gl.FLOAT, false, 28, 24);
}

function render(time) {
  resize();

  // Fog changes when the camera is inside water or lava.
  const inside = world.KIND[blockAt(Math.floor(camera.x), Math.floor(camera.y), Math.floor(camera.z))];
  let fogColor = FOG_COLOR, fogStart = 20, fogEnd = RENDER_DISTANCE * CHUNK_SIZE - 24;
  if (inside === world.K.WATER) { fogColor = WATER_FOG_COLOR; fogStart = 0; fogEnd = 28; }
  else if (inside === world.K.LAVA) { fogColor = LAVA_FOG_COLOR; fogStart = 0; fogEnd = 3; }

  gl.clearColor(fogColor[0], fogColor[1], fogColor[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.uniform3fv(uni.fogColor, fogColor);
  gl.uniform2f(uni.fog, fogStart, fogEnd);
  gl.uniform1f(uni.time, time / 1000);
  gl.uniformMatrix4fv(uni.proj, false, projectionMatrix(canvas.width / canvas.height));
  gl.uniformMatrix4fv(uni.view, false, viewMatrix());

  const f = forwardVector();
  const visible = [];
  for (const chunk of chunks.values()) {
    const ox = chunk.cx * CHUNK_SIZE - camera.x;
    const oz = chunk.cz * CHUNK_SIZE - camera.z;
    // Skip chunks entirely behind the camera.
    const mx = ox + CHUNK_SIZE / 2, mz = oz + CHUNK_SIZE / 2;
    const dist = Math.hypot(mx, mz);
    if (dist > CHUNK_SIZE * 2 && (mx * f[0] + mz * f[2]) / dist < -0.5 && Math.abs(f[1]) < 0.8) continue;
    visible.push([chunk, ox, oz]);
  }

  // Solid blocks first...
  gl.disable(gl.BLEND);
  gl.depthMask(true);
  gl.uniform1f(uni.alpha, 1);
  for (const [chunk, ox, oz] of visible) {
    if (!chunk.opaque) continue;
    gl.uniform3f(uni.offset, ox, -camera.y, oz);
    bindChunkBuffer(chunk.opaque);
    gl.drawArrays(gl.TRIANGLES, 0, chunk.opaqueCount);
  }

  // ...then see-through water on top.
  gl.enable(gl.BLEND);
  gl.depthMask(false);
  gl.uniform1f(uni.alpha, 0.72);
  for (const [chunk, ox, oz] of visible) {
    if (!chunk.water) continue;
    gl.uniform3f(uni.offset, ox, -camera.y, oz);
    bindChunkBuffer(chunk.water);
    gl.drawArrays(gl.TRIANGLES, 0, chunk.waterCount);
  }
  gl.depthMask(true);
}

let lastTime = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;
  if (inMenu) {
    camera.yaw += dt * 0.05;                     // slow panorama behind the menu
  } else if (mode === "first") {
    // Fixed small physics steps keep collisions solid at any frame rate.
    const n = Math.ceil(dt / (1 / 120));
    for (let i = 0; i < n; i++) updatePlayer(dt / n);
  } else {
    updateMovement(dt);
    updateClimb(dt);
  }
  updateChunks();
  updateInfo(dt);
  render(now);
  requestAnimationFrame(frame);
}

createAtlas().then((tex) => {
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  drawControls();
  drawModeButton();
  drawCrosshair();
  drawMenu();
  openMenu();
  startWorkers();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
