<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Example Clicker</title>
  <style>
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: #14161f; color: #fff; font-family: system-ui, sans-serif; }
    button { font-size: 2rem; padding: 24px 40px; border-radius: 16px; border: 0; background: #6c8cff; color: #fff; cursor: pointer; }
    button:active { transform: scale(.96); }
  </style>
</head>
<body>
  <div style="text-align:center">
    <h1 id="score">0</h1>
    <button id="btn">Click!</button>
  </div>
  <script>
    let score = Number(localStorage.getItem("clicker-score")) || 0;
    const el = document.getElementById("score");
    el.textContent = score;
    document.getElementById("btn").onclick = () => {
      el.textContent = ++score;
      localStorage.setItem("clicker-score", score);
    };
  </script>
</body>
</html>
